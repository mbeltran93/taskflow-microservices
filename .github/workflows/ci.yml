name: CI

# Corre en cada push (y en cada PR, para ver el resultado antes de mergear).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, project-service, task-service, api-gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # user-service usa Testcontainers (levanta un Postgres real en Docker
      # para UserPostgresTestcontainersTest); los runners ubuntu-latest de
      # GitHub Actions ya traen Docker instalado y corriendo, asi que no
      # hace falta configuracion extra para que ese test ande en CI.
      - name: mvn test (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: mvn -B test

      - name: Publicar resultados de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Build imagen Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, project-service, task-service, api-gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Solo build: valida que la imagen de cada servicio compila de punta a
      # punta (incluye el `mvn package` del Dockerfile), sin pushear a
      # ningun registry. El push a Artifact Registry de GCP quedaria como
      # paso aparte el dia que haya credenciales de un proyecto real.
      - name: Build de la imagen (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: taskflow/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  codeql:
    name: CodeQL (analisis de seguridad)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # No hay un pom.xml raiz que agregue los 4 modulos, asi que se
      # compila cada uno por separado para que CodeQL tenga el bytecode de
      # los 4 servicios disponible para analizar.
      - name: Compilar los 4 modulos para el analisis
        run: |
          set -e
          for service in user-service project-service task-service api-gateway; do
            echo "== building $service =="
            mvn -q -B -DskipTests -f "$service/pom.xml" package
          done

      - name: Analisis CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
