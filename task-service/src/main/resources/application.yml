server:
  port: 8083

spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/taskdb?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:taskflow-portfolio-super-secret-key-change-me-0123456789}

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# El %X{traceId} toma el valor que TraceIdFilter pone en el MDC por request,
# asi que cada linea de log queda correlacionada con el X-Trace-Id de punta a
# punta entre servicios (ver tracing/TraceIdFilter.java).
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-sin-traceId} %logger{36} - %msg%n"
