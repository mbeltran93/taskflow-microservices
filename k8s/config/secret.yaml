# PLANTILLA de ejemplo, solo para que `kubectl apply --dry-run=client` tenga
# algo valido que validar y para documentar que variables son sensibles.
#
# Estos valores de relleno (CHANGEME_*) NO se aplican nunca a un cluster
# real. En GKE la practica correcta es una de estas dos:
#
#   1) kubectl create secret generic taskflow-secrets \
#        --namespace=taskflow \
#        --from-literal=JWT_SECRET='<secreto real>' \
#        --from-literal=USER_DB_PASSWORD='<...>' \
#        --from-literal=PROJECT_DB_PASSWORD='<...>' \
#        --from-literal=TASK_DB_PASSWORD='<...>'
#      (nunca commitear ese comando con los valores reales)
#
#   2) Secret Manager de GCP + el CSI driver de Secret Manager (o External
#      Secrets Operator), para que el secreto viva en Secret Manager con
#      IAM/rotacion y Kubernetes solo lo monte/proyecte en runtime.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  JWT_SECRET: "CHANGEME_jwt_secret"
  USER_DB_USERNAME: "CHANGEME_user_db_username"
  USER_DB_PASSWORD: "CHANGEME_user_db_password"
  PROJECT_DB_USERNAME: "CHANGEME_project_db_username"
  PROJECT_DB_PASSWORD: "CHANGEME_project_db_password"
  TASK_DB_USERNAME: "CHANGEME_task_db_username"
  TASK_DB_PASSWORD: "CHANGEME_task_db_password"
