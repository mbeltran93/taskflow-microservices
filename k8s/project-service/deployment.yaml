apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: taskflow
  labels:
    app: project-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          # Reemplazar por la imagen publicada en Artifact Registry, p.ej.:
          # us-central1-docker.pkg.dev/<PROJECT_ID>/taskflow/project-service:<tag>
          image: taskflow/project-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              # En GKE: Cloud SQL (MySQL) via el Cloud SQL Auth Proxy, igual
              # que en user-service.
              value: "jdbc:mysql://127.0.0.1:3306/projectdb?createDatabaseIfNotExist=true"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: PROJECT_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: PROJECT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
