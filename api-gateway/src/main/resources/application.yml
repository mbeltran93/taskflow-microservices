server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/projects/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/tasks/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# A diferencia de los otros 3 servicios (Servlet, un thread fijo por
# request), el gateway corre sobre WebFlux: el pipeline reactivo puede saltar
# de thread entre operadores, asi que el MDC (ThreadLocal) no es confiable
# aca. TraceIdGlobalFilter por eso loguea el traceId explicito en el mensaje
# en vez de depender solo del patron de logging con %X{traceId}.
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
