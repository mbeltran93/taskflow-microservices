server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/projects/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/tasks/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
