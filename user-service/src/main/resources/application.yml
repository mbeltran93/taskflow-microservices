server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:taskflow-portfolio-super-secret-key-change-me-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# El %X{traceId} toma el valor que TraceIdFilter pone en el MDC por request,
# asi que cada linea de log queda correlacionada con el X-Trace-Id de punta a
# punta entre servicios (ver tracing/TraceIdFilter.java).
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-sin-traceId} %logger{36} - %msg%n"
